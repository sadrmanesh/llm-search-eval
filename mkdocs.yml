site_name: llm-search-eval
site_description: Evaluate e-commerce search and recommendation quality with LLM judges and classic IR metrics.
site_author: Naser Sadrmanesh
site_url: https://sadrmanesh.github.io/llm-search-eval/
repo_url: https://github.com/sadrmanesh/llm-search-eval
repo_name: sadrmanesh/llm-search-eval
edit_uri: ""
copyright: Copyright &copy; 2026 Naser Sadrmanesh

exclude_docs: |
  README.md

theme:
  name: material
  language: en
  icon:
    logo: material/magnify-scan
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-auto
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sadrmanesh
    - icon: material/web
      link: https://sadrmanesh.github.io/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Data formats: data-formats.md
  - Evaluation:
      - Relevance judges: relevance-judges.md
      - Panels and agreement: judges.md
      - Metrics: metrics.md
      - Confidence intervals: statistics.md
      - Pairwise comparison: pairwise.md
      - Sampling and strata: sampling.md
      - Cost and budgets: cost.md
  - Output and automation:
      - Reports and dashboard: reports.md
      - Quality gates in CI: ci.md
      - Pull request comments: pr-comments.md
      - Live search connectors: connectors.md
  - Python API: python-api.md
  - Docker: docker.md
  - Persian support: persian.md
  - Releasing: releasing.md
  - Changelog: changelog.md
  - فارسی: fa.md
