name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match pyproject version $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-search-eval/
    permissions:
      id-token: write
      contents: read
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      TRUSTED_PUBLISHING: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Choose publishing method
        id: method
        run: |
          if [ "$TRUSTED_PUBLISHING" = "true" ]; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          elif [ -n "$PYPI_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice title=PyPI publish skipped::Set the repository variable PYPI_TRUSTED_PUBLISHING=true (after adding a trusted publisher on PyPI) or add a PYPI_API_TOKEN secret to publish."
          fi
      - name: Publish with trusted publishing
        if: steps.method.outputs.mode == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish with API token
        if: steps.method.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker:
    name: Publish the Docker image to GHCR
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sadrmanesh/llm-search-eval
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=llm-search-eval
            org.opencontainers.image.description=Evaluate product search quality with IR metrics, LLM judges, cost tracking, and CI quality gates
            org.opencontainers.image.source=https://github.com/sadrmanesh/llm-search-eval
            org.opencontainers.image.url=https://sadrmanesh.github.io/llm-search-eval/
            org.opencontainers.image.documentation=https://sadrmanesh.github.io/llm-search-eval/docker/
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Naser Sadrmanesh
          annotations: |
            org.opencontainers.image.title=llm-search-eval
            org.opencontainers.image.description=Evaluate product search quality with IR metrics, LLM judges, cost tracking, and CI quality gates
            org.opencontainers.image.source=https://github.com/sadrmanesh/llm-search-eval
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub:
    name: Copy the Docker image to Docker Hub
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check for Docker Hub credentials
        id: creds
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; skipping Docker Hub."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Copy every platform from GHCR
        if: steps.creds.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          src="ghcr.io/sadrmanesh/llm-search-eval:${version}"
          dst="docker.io/${DOCKERHUB_USERNAME}/llm-search-eval"
          for tag in "${version}" "${version%.*}" latest; do
            docker buildx imagetools create --tag "${dst}:${tag}" "${src}"
          done
          docker buildx imagetools inspect "${dst}:${version}"
